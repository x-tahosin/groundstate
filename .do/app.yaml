name: groundstate
region: nyc
services:
  - name: web
    github:
      branch: main
      deploy_on_push: true
    build_command: npm run build
    run_command: npm run start -- -p 8080
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    health_check:
      http_path: /api/health/
      initial_delay_seconds: 15
      period_seconds: 20
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: DIGITALOCEAN_API_KEY
        type: SECRET
        description: "DigitalOcean Serverless AI API Key (Bearer token)"
      - key: DIGITALOCEAN_INFERENCE_ENDPOINT
        value: https://inference.do-ai.run/v1
        scope: RUN_TIME
      - key: DIGITALOCEAN_MODEL
        value: meta-llama/Meta-Llama-3.1-8B-Instruct
        scope: RUN_TIME
